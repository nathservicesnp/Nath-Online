name: iPhone preview build
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-preview.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Build unsigned iPhone simulator app
        run: xcodebuild -project ios/NathPreview.xcodeproj -scheme NathPreview -sdk iphonesimulator -configuration Debug -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Install and launch in simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for rows in d["devices"].values() for v in rows if "iPhone" in v["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" ios/build/Build/Products/Debug-iphonesimulator/NathPreview.app
          xcrun simctl launch "$DEVICE" np.com.nathonline.preview
          sleep 5
          xcrun simctl io "$DEVICE" screenshot ios/build/iphone-dashboard.png
      - uses: actions/upload-artifact@v4
        with:
          name: Nath-iPhone-Simulator
          path: |
            ios/build/Build/Products/Debug-iphonesimulator/NathPreview.app
            ios/build/iphone-dashboard.png
          retention-days: 30

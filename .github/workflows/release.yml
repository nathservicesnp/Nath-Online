name: Approved website release
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RELEASE to deploy this main commit
        required: true
permissions:
  contents: read
concurrency:
  group: nath-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RELEASE'
    uses: ./.github/workflows/checks.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Configure a dedicated deployment token and account ID in the production environment.'
            exit 1
          fi
          pnpm exec wrangler deploy --env production
